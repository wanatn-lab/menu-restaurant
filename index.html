<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - ร้านข้าวมันไก่กิมเก๊ก & โกปี๊</title>
    <!-- Tailwind CSS สำหรับ UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Prompt', sans-serif; }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- 1. Header & Location (Sticky Top) -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto">
            <!-- ภาพปกและข้อมูลร้าน -->
            <div class="relative h-36 bg-gray-300">
                <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&q=80&w=600&h=300" alt="Cover" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
                <div class="absolute bottom-3 left-4 right-4 flex justify-between items-end text-white">
                    <div>
                        <h1 class="text-lg font-bold leading-tight">ร้านข้าวมันไก่กิมเก๊ก & โกปี๊</h1>
                        <p class="text-xs text-gray-200 mt-0.5"><i class="fa-solid fa-location-dot text-red-400"></i> สุพรรณบุรี</p>
                    </div>
                    <a href="https://maps.app.goo.gl/xxxxxx" target="_blank" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow flex items-center gap-1.5 hover:bg-green-700 transition shrink-0">
                        <i class="fa-solid fa-compass"></i> ไปที่ร้าน
                    </a>
                </div>
            </div>

            <!-- 2. Category Navigation (Horizontal Scroll) -->
            <div class="bg-white px-4 py-2.5 border-b flex overflow-x-auto gap-2 no-scrollbar" id="category-container">
                <!-- ปุ่มหมวดหมู่จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>
    </header>

    <!-- App Container -->
    <main class="max-w-md mx-auto w-full pb-10">
        <!-- 3. Menu List (รายการอาหารแบบ View Only) -->
        <div class="p-4 space-y-3" id="menu-container">
            <!-- รายการอาหารจะถูกสร้างด้วย JavaScript -->
        </div>
    </main>

    <!-- Data & Logic (JavaScript) -->
    <script>
        // ฐานข้อมูลเมนูอาหาร
        const menuData = [
            { id: 1, name: 'ข้าวมันไก่ต้มพิเศษ', desc: 'ไก่เนื้อนุ่มฉ่ำ เสิร์ฟพร้อมข้าวมันหอมกรุ่น และน้ำจิ้มรสเด็ด', price: 50, category: 'เมนูแนะนำ', img: 'https://images.unsplash.com/photo-1594041680534-e8c8cdebd659?auto=format&fit=crop&q=80&w=200&h=200', tag: 'แนะนำ', video: 'https://www.w3schools.com/html/mov_bbb.mp4' },
            { id: 2, name: 'ฮะเก๋าจักรพรรดิ', desc: 'แป้งบางใส ไส้กุ้งเน้นๆ เต็มคำ นึ่งสดๆ ร้อนๆ', price: 45, category: 'ติ่มซำ', img: 'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&q=80&w=200&h=200', tag: 'ยอดฮิต' },
            { id: 3, name: 'โกปี๊เย็น', desc: 'กาแฟโบราณคั่วหอม ชงเข้มข้น ความมันกำลังดี', price: 35, category: 'เครื่องดื่ม', img: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&q=80&w=200&h=200', video: 'https://www.w3schools.com/html/mov_bbb.mp4' },
            { id: 4, name: 'ข้าวมันไก่ทอด', desc: 'ไก่ทอดกรอบนอกนุ่มใน ทานคู่กับน้ำจิ้มไก่สูตรพิเศษ', price: 50, category: 'ข้าวมันไก่', img: 'https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&q=80&w=200&h=200' }
        ];

        const categories = ['ทั้งหมด', ...new Set(menuData.map(item => item.category))];
        let currentCategory = 'ทั้งหมด';

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = categories.map(cat => `
                <button onclick="filterMenu('${cat}')"
                    class="px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all duration-200 
                    ${currentCategory === cat ? 'bg-orange-500 text-white shadow' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            if (items.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 mt-10 text-sm">ไม่พบเมนูในหมวดหมู่นี้</p>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 flex gap-3 items-center">
                    <!-- รูปภาพ / วิดีโอ -->
                    <div class="relative w-20 h-20 shrink-0 rounded-lg overflow-hidden bg-gray-100 shadow-inner">
                        <img src="${item.img}" id="img-${item.id}" class="w-full h-full object-cover absolute inset-0 z-10 transition-opacity duration-300">
                        ${item.video ? `
                            <button onclick="playVideo(event, ${item.id})" id="btn-${item.id}" 
                                class="absolute top-1 right-1 z-20 bg-black/60 text-white rounded-full w-5 h-5 flex items-center justify-center backdrop-blur-sm">
                                <i class="fa-solid fa-play text-[9px] ml-0.5"></i>
                            </button>
                            <video id="vid-${item.id}" src="${item.video}" class="w-full h-full object-cover absolute inset-0 z-0" muted loop playsinline></video>
                        ` : ''}
                        ${item.tag ? `<span class="absolute bottom-1 left-1 z-20 bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded font-medium shadow-sm">${item.tag}</span>` : ''}
                    </div>
                    
                    <!-- รายละเอียดข้อมูล -->
                    <div class="flex flex-col justify-between flex-1 py-0.5">
                        <div>
                            <h3 class="text-sm font-semibold text-gray-900 leading-snug">${item.name}</h3>
                            <p class="text-[11px] text-gray-500 mt-0.5 line-clamp-2 leading-relaxed">${item.desc}</p>
                        </div>
                        <div class="mt-1">
                            <span class="text-orange-600 font-bold text-sm">฿${item.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.playVideo = (event, id) => {
            event.stopPropagation();
            const img = document.getElementById(`img-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            const vid = document.getElementById(`vid-${id}`);
            if(btn) btn.style.display = 'none';
            if(img) { img.style.opacity = '0'; img.style.pointerEvents = 'none'; }
            if(vid) vid.play();
        };

        window.filterMenu = (category) => {
            currentCategory = category;
            renderCategories();
            renderMenu(category === 'ทั้งหมด' ? menuData : menuData.filter(item => item.category === category));
        };

        renderCategories();
        renderMenu(menuData);
    </script>
</body>
</html>
