<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านข้าวมันไก่กิมเง็ก & ติ่มซำโกปี๊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f5f5f4; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #f5f5f4; }
        .menu-card { transition: all 0.2s ease; }
        .menu-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-stone-100 text-stone-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ADMIN_PASSWORD = "123456";

        const defaultMenus = [
            { id: 1, name: "ข้าวมันไก่ต้ม (สูตรกิมเง็ก)", desc: "ไก่เนื้อนุ่มฉ่ำ ข้าวมันหอมกรุ่น น้ำจิ้มรสเด็ด", price: 50, category: "ข้าวมันไก่", mediaUrl: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=800&q=80", type: "image", isRecommend: true },
            { id: 2, name: "ฮะเก๋ากุ้ง (โกปี๊ หลังโรงไม้)", desc: "แป้งบางใส ไส้กุ้งเด้งเต็มคำ นึ่งร้อนๆ สดใหม่", price: 55, category: "ติ่มซำ", mediaUrl: "https://assets.mixkit.co/videos/preview/mixkit-putting-dumplings-in-a-steamer-43026-large.mp4", type: "video", isRecommend: true },
            { id: 3, name: "โกปี๊เย็นโบราณ", desc: "กาแฟโบราณคั่วเข้ม หอมหวานมันกำลังดี", price: 35, category: "เครื่องดื่ม", mediaUrl: "https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?auto=format&fit=crop&w=800&q=80", type: "image", isRecommend: false }
        ];

        const App = () => {
            const [view, setView] = useState('customer');
            const [pinInput, setPinInput] = useState('');
            
            const [menus, setMenus] = useState(() => {
                const saved = localStorage.getItem('restaurant_menus_v2');
                return saved ? JSON.parse(saved) : defaultMenus;
            });
            const [activeCategory, setActiveCategory] = useState('แนะนำ');
            const categories = ['แนะนำ', 'ข้าวมันไก่', 'ติ่มซำ', 'เครื่องดื่ม'];

            useEffect(() => {
                const handleHashChange = () => {
                    if (window.location.hash === '#/admin') {
                        setView('admin_login');
                    } else {
                        setView('customer');
                    }
                };
                handleHashChange(); 
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                localStorage.setItem('restaurant_menus_v2', JSON.stringify(menus));
            }, [menus]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pinInput === ADMIN_PASSWORD) {
                    setView('admin_dashboard');
                    setPinInput('');
                } else {
                    alert('❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่');
                    setPinInput('');
                }
            };

            const handleAddMenu = (e) => {
                e.preventDefault();
                const name = e.target.name.value;
                const desc = e.target.desc.value;
                const price = parseFloat(e.target.price.value);
                const category = e.target.category.value;
                const mediaUrl = e.target.mediaUrl.value;
                const isRecommend = e.target.recommend.checked;
                const type = mediaUrl.includes('.mp4') ? 'video' : 'image';

                const newMenu = { id: Date.now(), name, desc, price, category, mediaUrl, type, isRecommend };
                setMenus([newMenu, ...menus]);
                e.target.reset();
                alert('เพิ่มเมนูสำเร็จ!');
            };

            const handleDelete = (id) => {
                if(confirm('ต้องการลบเมนูนี้ใช่หรือไม่?')) {
                    setMenus(menus.filter(m => m.id !== id));
                }
            };

            const filteredMenus = activeCategory === 'แนะนำ' 
                ? menus.filter(m => m.isRecommend)
                : menus.filter(m => m.category === activeCategory);

            return (
                <div className="max-w-7xl mx-auto bg-white min-h-screen shadow-2xl relative overflow-hidden flex flex-col">
                    
                    {/* Header สำหรับหน้าลูกค้า */}
                    {view === 'customer' && (
                        <div className="px-6 md:px-12 py-5 bg-stone-900 text-white flex justify-between items-center z-50 relative shadow-md">
                            <div>
                                <h1 className="text-xl md:text-3xl font-bold tracking-wide text-amber-500">ข้าวมันไก่กิมเง็ก & โกปี๊</h1>
                                <p className="text-xs md:text-sm text-stone-300 mt-1">เมนูดิจิทัลอัจฉริยะ</p>
                            </div>
                        </div>
                    )}

                    {/* Header สำหรับหน้าหลังบ้าน */}
                    {view === 'admin_dashboard' && (
                        <div className="px-6 md:px-12 py-5 bg-amber-600 text-white flex justify-between items-center z-50 relative shadow-md">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold tracking-wide">จัดการระบบหลังบ้าน</h1>
                            </div>
                            <button onClick={() => window.location.hash = ''} className="text-sm bg-stone-900 text-white px-4 py-2 rounded-lg font-semibold hover:bg-stone-800 transition">
                                🚪 ออกจากระบบ
                            </button>
                        </div>
                    )}

                    {/* ---------------- 1. หน้าลูกค้า (Customer View) ---------------- */}
                    {view === 'customer' && (
                        <div className="flex-1 flex flex-col">
                            {/* หมวดหมู่ */}
                            <div className="glass-effect px-4 md:px-12 py-4 flex justify-start md:justify-center overflow-x-auto gap-3 md:gap-4 sticky top-0 z-40 no-scrollbar">
                                {categories.map(cat => (
                                    <button 
                                        key={cat} onClick={() => setActiveCategory(cat)}
                                        className={`whitespace-nowrap px-6 py-2.5 rounded-full text-sm md:text-base font-semibold transition-all duration-300 ${activeCategory === cat ? 'bg-amber-600 text-white shadow-lg transform scale-105' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            {/* รายการอาหาร (Grid System) */}
                            <div className="bg-stone-50 p-4 md:p-8 flex-1">
                                {filteredMenus.length === 0 && (
                                    <div className="text-center py-20 text-stone-400 text-base">ยังไม่มีเมนูในหมวดหมู่นี้</div>
                                )}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                                    {filteredMenus.map(menu => (
                                        <div key={menu.id} className="menu-card bg-white rounded-xl shadow-sm border border-stone-100 overflow-hidden flex flex-col">
                                            <div className="relative w-full aspect-video bg-stone-200 overflow-hidden">
                                                {menu.type === 'video' ? (
                                                    <video autoPlay loop muted playsInline className="object-cover w-full h-full">
                                                        <source src={menu.mediaUrl} type="video/mp4" />
                                                    </video>
                                                ) : (
                                                    <img src={menu.mediaUrl} alt={menu.name} className="object-cover w-full h-full" loading="lazy" />
                                                )}
                                                {menu.isRecommend && (
                                                    <div className="absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded shadow-md tracking-wider">RECOMMENDED</div>
                                                )}
                                            </div>
                                            <div className="p-5 flex flex-col flex-1">
                                                <h3 className="text-lg md:text-xl font-bold text-stone-800 leading-snug">{menu.name}</h3>
                                                <p className="text-sm text-stone-500 mt-2 leading-relaxed flex-1">{menu.desc}</p>
                                                <div className="text-2xl font-bold text-amber-600 mt-4 border-t border-stone-100 pt-3 text-right">
                                                    ฿{menu.price}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ---------------- 2. หน้ากรอกรหัสผ่าน (Login View) ---------------- */}
                    {view === 'admin_login' && (
                        <div className="min-h-screen bg-stone-50 flex flex-col justify-center items-center p-6">
                            <div className="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md text-center border border-stone-100">
                                <div className="text-5xl mb-6">🔒</div>
                                <h2 className="text-2xl font-bold text-stone-800 mb-2">เฉพาะเจ้าหน้าที่</h2>
                                <p className="text-sm text-stone-500 mb-8">กรุณาใส่รหัสผ่านเพื่อเข้าสู่ระบบจัดการ</p>
                                
                                <form onSubmit={handleLogin}>
                                    <input 
                                        type="password" 
                                        value={pinInput}
                                        onChange={(e) => setPinInput(e.target.value)}
                                        placeholder="ใส่รหัสผ่าน..." 
                                        className="w-full text-center text-xl tracking-[0.5em] rounded-xl border-stone-300 border p-4 focus:ring-2 focus:ring-amber-500 focus:outline-none mb-6" 
                                        required
                                    />
                                    <button type="submit" className="w-full bg-amber-600 text-white font-bold py-4 rounded-xl text-lg hover:bg-amber-700 transition">
                                        เข้าสู่ระบบ
                                    </button>
                                </form>
                                <button onClick={() => window.location.hash = ''} className="mt-6 text-sm text-stone-400 hover:text-stone-600 underline">
                                    กลับไปหน้าลูกค้า
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ---------------- 3. หน้าจัดการหลังบ้าน (Admin Dashboard) ---------------- */}
                    {view === 'admin_dashboard' && (
                        <div className="p-4 md:p-8 bg-stone-50 flex-1">
                            <div className="max-w-4xl mx-auto">
                                <h2 className="text-xl md:text-2xl font-bold text-stone-800 mb-6 flex items-center gap-3">
                                    <span className="bg-amber-500 w-2 h-6 rounded"></span> ฟอร์มเพิ่มเมนูอาหาร / วิดีโอ
                                </h2>
                                
                                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-stone-200 mb-10">
                                    <form onSubmit={handleAddMenu} className="space-y-5">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                            <div>
                                                <label className="block text-sm font-bold text-stone-700 mb-2">ชื่อเมนู</label>
                                                <input type="text" name="name" required placeholder="เช่น ข้าวมันไก่ตอนพิเศษ" className="w-full rounded-lg border-stone-300 border p-3 focus:ring-2 focus:ring-amber-500 focus:outline-none" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-stone-700 mb-2">หมวดหมู่</label>
                                                <select name="category" className="w-full rounded-lg border-stone-300 border p-3 bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                                    <option value="ข้าวมันไก่">ข้าวมันไก่</option>
                                                    <option value="ติ่มซำ">ติ่มซำ</option>
                                                    <option value="เครื่องดื่ม">เครื่องดื่ม</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-stone-700 mb-2">คำบรรยายความอร่อย</label>
                                            <textarea name="desc" rows="2" placeholder="ไก่เนื้อนุ่มฉ่ำ..." className="w-full rounded-lg border-stone-300 border p-3 focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                            <div>
                                                <label className="block text-sm font-bold text-stone-700 mb-2">ราคา (บาท)</label>
                                                <input type="number" name="price" required placeholder="50" className="w-full rounded-lg border-stone-300 border p-3 focus:ring-2 focus:ring-amber-500 focus:outline-none" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-stone-700 mb-2">ลิงก์รูปภาพ หรือ วิดีโอ (.mp4)</label>
                                                <input type="url" name="mediaUrl" required placeholder="วางลิงก์รูปภาพ หรือคลิป .mp4" className="w-full rounded-lg border-stone-300 border p-3 focus:ring-2 focus:ring-amber-500 focus:outline-none" />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3 py-2">
                                            <input type="checkbox" name="recommend" id="rec" className="w-5 h-5 text-amber-600 rounded border-stone-300 focus:ring-amber-500" />
                                            <label htmlFor="rec" className="text-sm font-bold text-stone-700 cursor-pointer">ตั้งเป็นเมนูแนะนำ (Recommended)</label>
                                        </div>
                                        <button type="submit" className="w-full bg-stone-900 text-white font-bold py-4 rounded-xl hover:bg-stone-800 transition text-lg shadow-md mt-2">
                                            💾 บันทึกเมนูขึ้นระบบ
                                        </button>
                                    </form>
                                </div>

                                <h3 className="text-xl font-bold text-stone-800 mb-6 flex items-center gap-3">
                                    <span className="bg-stone-300 w-2 h-6 rounded"></span> จัดการรายการเมนูที่มีในระบบ
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {menus.map(menu => (
                                        <div key={menu.id} className="flex gap-4 bg-white p-4 rounded-xl shadow-sm items-center border border-stone-200">
                                            <div className="w-20 h-20 bg-stone-100 rounded-lg overflow-hidden shrink-0">
                                                {menu.type === 'video' ? 
                                                    <video src={menu.mediaUrl} className="w-full h-full object-cover" /> : 
                                                    <img src={menu.mediaUrl} className="w-full h-full object-cover" />
                                                }
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h4 className="font-bold text-stone-800 text-sm md:text-base truncate">{menu.name}</h4>
                                                <p className="text-xs md:text-sm text-stone-500 mt-1">{menu.category} • ฿{menu.price}</p>
                                            </div>
                                            <button onClick={() => handleDelete(menu.id)} className="text-red-500 text-sm font-semibold px-4 py-2 bg-red-50 hover:bg-red-100 rounded-lg transition">
                                                ลบ
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
