<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Menu | สั่งอาหารออนไลน์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .menu-card { transition: all 0.2s ease-in-out; }
        .menu-card:active { transform: scale(0.97); }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- App Container (Mobile First Design) -->
    <main class="max-w-md mx-auto w-full min-h-screen bg-white relative shadow-2xl">
        
        <!-- 1. Header (Cover Image & Store Info) -->
        <header class="relative">
            <div class="h-48 w-full bg-slate-200">
                <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80" alt="Cover" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
            </div>
            <div class="absolute bottom-0 left-0 p-5 text-white w-full">
                <div class="flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-bold drop-shadow-md">ร้านข้าวมันไก่กิมเง็ก & โกปี๊</h1>
                        <p class="text-sm text-slate-200 mt-1"><i class="fa-solid fa-location-dot mr-1"></i> สุพรรณบุรี</p>
                    </div>
                    <span class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-md mb-1"><i class="fa-solid fa-clock mr-1"></i> เปิดอยู่</span>
                </div>
            </div>
        </header>

        <!-- 2. Sticky Category Navigation -->
        <div class="glass-header px-4 py-3 border-b border-slate-100 flex overflow-x-auto gap-3 no-scrollbar sticky top-0 z-40 shadow-sm" id="category-container">
            <!-- Render by JS -->
        </div>

        <!-- 3. Menu List -->
        <div class="p-4 pb-24 bg-slate-50" id="menu-container">
            <!-- Render by JS -->
        </div>

        <!-- 4. Floating Action Button (Cart) -->
        <div class="fixed bottom-6 left-0 w-full px-4 z-50 pointer-events-none max-w-md mx-auto right-0">
            <button class="w-full bg-orange-600 text-white p-4 rounded-2xl shadow-xl flex justify-between items-center pointer-events-auto hover:bg-orange-700 transition active:scale-95">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 px-3 py-1 rounded-full font-bold">3</div>
                    <span class="font-medium">ดูตะกร้าสินค้า</span>
                </div>
                <span class="font-bold text-lg">฿140</span>
            </button>
        </div>

    </main>

    <script>
        // Data Structure สำหรับ Production
        const menuData = [
            { id: 1, name: 'ข้าวมันไก่ต้มพิเศษ', desc: 'ไก่เนื้อนุ่มฉ่ำ เสิร์ฟพร้อมข้าวมันหอมกรุ่น และน้ำจิ้มรสเด็ด', price: 50, category: 'ข้าวมันไก่', img: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=400&q=80', isRecommend: true },
            { id: 2, name: 'ข้าวมันไก่ทอด', desc: 'ไก่ทอดกรอบนอกนุ่มใน น้ำจิ้มไก่สูตรพิเศษ', price: 50, category: 'ข้าวมันไก่', img: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=400&q=80', isRecommend: false },
            { id: 3, name: 'ฮะเก๋ากุ้งจักรพรรดิ', desc: 'แป้งบางใส ไส้กุ้งเด้งเต็มคำ นึ่งร้อนๆ สดใหม่', price: 45, category: 'ติ่มซำ', img: 'https://images.unsplash.com/photo-1563227812-0ea4c22e6cc8?auto=format&fit=crop&w=400&q=80', isRecommend: true },
            { id: 4, name: 'ขนมจีบหมูเห็ดหอม', desc: 'เนื้อหมูเน้นๆ หอมกลิ่นเห็ดหอม', price: 35, category: 'ติ่มซำ', img: 'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=400&q=80', isRecommend: false },
            { id: 5, name: 'โกปี๊เย็น', desc: 'กาแฟโบราณคั่วหอม ชงเข้มข้น หวานมันกำลังดี', price: 35, category: 'เครื่องดื่ม', img: 'https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?auto=format&fit=crop&w=400&q=80', isRecommend: true },
            { id: 6, name: 'ชาดำเย็น', desc: 'ชาไทยสกัดเข้มข้น หอมสดชื่นดับกระหาย', price: 30, category: 'เครื่องดื่ม', img: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=400&q=80', isRecommend: false }
        ];

        const categories = ['เมนูแนะนำ', ...new Set(menuData.map(item => item.category))];
        let currentCategory = 'เมนูแนะนำ';

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = categories.map(cat => `
                <button 
                    onclick="filterMenu('${cat}')"
                    class="px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all duration-300 
                    ${currentCategory === cat ? 'bg-slate-800 text-white shadow-md transform scale-105' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}"
                >
                    ${cat}
                </button>
            `).join('');
        }

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-slate-400">
                        <i class="fa-solid fa-plate-wheat text-4xl mb-3"></i>
                        <p>ยังไม่มีเมนูในหมวดหมู่นี้</p>
                    </div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="menu-card bg-white rounded-2xl shadow-sm border border-slate-100 p-3 mb-4 flex gap-4 cursor-pointer relative overflow-hidden">
                    ${item.isRecommend ? '<div class="absolute top-0 left-0 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-br-lg z-10">แนะนำ</div>' : ''}
                    
                    <div class="w-28 h-28 shrink-0 relative">
                        <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover rounded-xl bg-slate-100">
                    </div>
                    
                    <div class="flex flex-col justify-between flex-1 py-1 pr-1">
                        <div>
                            <h3 class="text-md font-bold text-slate-800 leading-tight">${item.name}</h3>
                            <p class="text-xs text-slate-500 mt-1.5 line-clamp-2 leading-relaxed">${item.desc}</p>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-orange-600 font-bold text-lg">฿${item.price}</span>
                            <button class="w-8 h-8 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center hover:bg-orange-100 transition">
                                <i class="fa-solid fa-plus text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.filterMenu = (category) => {
            currentCategory = category;
            renderCategories(); 
            
            const filtered = category === 'เมนูแนะนำ' 
                ? menuData.filter(item => item.isRecommend)
                : menuData.filter(item => item.category === category);
                
            renderMenu(filtered);
            
            // เพิ่ม Offset ตอน Scroll เพื่อไม่ให้ Header บังคอนเทนต์
            window.scrollTo({ top: document.querySelector('header').offsetHeight - 20, behavior: 'smooth' });
        };

        // Initialize
        renderCategories();
        filterMenu('เมนูแนะนำ');
    </script>
</body>
</html>
